name: Feature request
description: Suggest something Onyx should do
labels: [ enhancement ]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the feature and the problem it solves for you.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: How you play, other launchers that do it well, screenshots.
