[package]
name = "onyx-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.23"
directories = "6"
getrandom = "0.4.3"
md-5 = "0.11"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "query", "form", "charset", "http2"] }
serde.workspace = true
serde_json.workspace = true
sha1 = "0.11"
sha2 = "0.11"
thiserror.workspace = true
tokio = { version = "1.54.1", features = ["net", "io-util", "time", "sync", "macros", "rt", "fs", "process"] }
tracing.workspace = true
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[build-dependencies]
dotenvy = "0.15"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
wiremock = "0.6.5"
