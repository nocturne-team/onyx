[workspace]
resolver = "3"
members = ["crates/onyx-core", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.90"

[workspace.dependencies]
onyx-core = { path = "crates/onyx-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = "s"
